services:

  postgres:
    image: postgres:16-alpine
    container_name: postgres_userhub
    restart: "no"

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    ports:
      - "127.0.0.1:${DB_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: flask-python312-slim:dev

    build:
      context: ./back_end

    volumes:
      - ./back_end:/app

    restart: "no"

    ports:
      - "127.0.0.1:5000:5000"
      - "127.0.0.1:${DEBUG_PORT}:${DEBUG_PORT}"

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      FLASK_HOST: ${FLASK_HOST:-0.0.0.0}
      FLASK_PORT: ${FLASK_PORT:-5000}
      DEBUG: ${DEBUG}
      DEBUG_HOST: ${DEBUG_HOST:-0.0.0.0}
      DEBUG_PORT: ${DEBUG_PORT}

  frontend:
    image: vue-node22:dev

    build:
      context: ./front_end

    volumes:
      - ./front_end:/app

    restart: "no"

    ports:
      - "127.0.0.1:${FRONTEND_PORT}:80"

    depends_on:
      - backend

volumes:
  postgres_data: